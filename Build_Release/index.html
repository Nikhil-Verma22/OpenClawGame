<!DOCTYPE HTML>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OpenClaw - Captain Claw (1997)</title>
    <meta name="description" content="Reimplementation of Captain Claw (1997) platformer in WebAssembly">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden !important;
            position: fixed;
            top: 0;
            left: 0;
            background-color: #000;
            color: #c5c6c7;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        /* Centered Game Viewport with Pillarbox / Letterbox Margins */
        #game-viewport {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background-color: #000;
            overflow: hidden;
        }

        #canvas {
            display: none;
            max-width: 100vw;
            max-height: 100vh;
            object-fit: contain;
            background-color: #000;
            outline: none;
            box-shadow: 0 0 20px rgba(0,0,0,0.9);
        }

        #loading-screen {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1f2833 0%, #0b0c10 100%);
            padding: 20px;
            box-sizing: border-box;
        }

        .claw-logo {
            font-size: 2.2rem;
            font-weight: bold;
            color: #45f3ff;
            margin-bottom: 20px;
            letter-spacing: 2px;
            text-shadow: 0 0 12px rgba(69, 243, 255, 0.4);
        }

        #status-text {
            color: #45f3ff;
            font-size: 1.1rem;
            margin-bottom: 15px;
            font-weight: 500;
        }

        .progress-bar-container {
            width: 80%;
            max-width: 400px;
            height: 18px;
            background-color: #0b0c10;
            border-radius: 9px;
            overflow: hidden;
            border: 1px solid #45f3ff;
            box-shadow: 0 0 8px rgba(69, 243, 255, 0.2);
            margin-bottom: 12px;
        }

        #progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #45f3ff 0%, #00ffaa 100%);
            transition: width 0.15s ease-out;
        }

        #progress-details {
            color: #8892b0;
            font-size: 0.85rem;
        }

        /* Floating Settings Gear Button */
        #settings-gear-btn {
            position: fixed;
            top: 12px;
            right: 12px;
            z-index: 200;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(15, 25, 35, 0.65);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1.5px solid rgba(69, 243, 255, 0.5);
            color: #66fcf1;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
            transition: transform 0.2s, background 0.2s;
            pointer-events: auto;
        }

        #settings-gear-btn:active {
            transform: scale(0.9);
            background: rgba(69, 243, 255, 0.4);
        }

        /* Glassmorphism Settings Modal Overlay */
        #settings-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            z-index: 300;
            display: none;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
        }

        .settings-card {
            background: #1f2833;
            border: 1.5px solid #45f3ff;
            border-radius: 12px;
            padding: 20px 24px;
            width: 90%;
            max-width: 380px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 20px rgba(69, 243, 255, 0.2);
            color: #c5c6c7;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .settings-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(69, 243, 255, 0.2);
            padding-bottom: 8px;
            color: #66fcf1;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .settings-close-btn {
            background: none;
            border: none;
            color: #66fcf1;
            font-size: 1.3rem;
            cursor: pointer;
            padding: 0 4px;
        }

        .settings-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
        }

        .settings-row button, .settings-row select {
            background: #0b0c10;
            color: #66fcf1;
            border: 1px solid #45f3ff;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
        }

        /* Full Screen Touch Overlay (Covers Entire Viewport including Black Bars) */
        #touch-controls {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: auto;
            z-index: 100;
            display: none;
        }

        .touch-btn {
            position: absolute;
            pointer-events: auto;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            background: rgba(15, 25, 35, 0.45);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border: 1.5px solid rgba(69, 243, 255, 0.4);
            color: #45f3ff;
            font-weight: bold;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4), inset 0 0 10px rgba(69, 243, 255, 0.1);
            transition: background 0.1s, transform 0.05s, border-color 0.1s;
        }

        .touch-btn:active, .touch-btn.active {
            background: rgba(69, 243, 255, 0.7) !important;
            color: #0b0c10 !important;
            border-color: #00ffaa !important;
            transform: scale(0.92);
            box-shadow: 0 0 20px rgba(69, 243, 255, 0.9);
        }

        .touch-btn-util {
            padding: 6px 14px;
            font-size: 0.75rem;
            border-radius: 20px;
            letter-spacing: 0.5px;
        }

        /* Action Buttons Individual Positions */
        .action-btn {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            font-size: 1.1rem;
        }

        .btn-label {
            font-size: 0.48rem;
            letter-spacing: 0.5px;
            margin-top: 1px;
            opacity: 0.95;
            text-transform: uppercase;
        }

        /* Dynamic Floating 8-Direction Virtual Joystick */
        #joystick-container {
            position: absolute;
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: rgba(15, 25, 35, 0.45);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border: 2px solid rgba(69, 243, 255, 0.4);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5), inset 0 0 15px rgba(69, 243, 255, 0.15);
            pointer-events: auto;
            touch-action: none;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: border-color 0.15s, box-shadow 0.15s;
        }

        #joystick-container.active-drag {
            border-color: #00ffaa !important;
            box-shadow: 0 0 20px rgba(0, 255, 170, 0.6), inset 0 0 15px rgba(0, 255, 170, 0.3) !important;
        }

        #joystick-knob {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: radial-gradient(circle, #45f3ff 0%, #0088aa 100%);
            border: 2px solid #66fcf1;
            box-shadow: 0 0 12px rgba(69, 243, 255, 0.8);
            position: absolute;
            pointer-events: none;
            transition: transform 0.05s ease-out;
        }

        .joy-sector {
            position: absolute;
            color: rgba(69, 243, 255, 0.35);
            font-size: 0.7rem;
            font-weight: bold;
            pointer-events: none;
        }
        .joy-n { top: 6px; }
        .joy-s { bottom: 6px; }
        .joy-w { left: 8px; }
        .joy-e { right: 8px; }

        /* Clean Edit Mode Styling & Inline Tooltip Adjuster */
        .edit-mode-active {
            border: 2px dashed #00ffaa !important;
            background: rgba(0, 255, 170, 0.25) !important;
            box-shadow: 0 0 12px rgba(0, 255, 170, 0.7) !important;
            z-index: 150 !important;
        }

        #inline-size-tooltip {
            position: fixed;
            z-index: 250;
            display: none;
            background: #1f2833;
            border: 1.5px solid #00ffaa;
            border-radius: 20px;
            padding: 4px 10px;
            gap: 8px;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.7);
            font-size: 0.75rem;
            color: #00ffaa;
            pointer-events: auto;
        }

        .inline-size-btn {
            background: #0b0c10;
            color: #66fcf1;
            border: 1px solid #45f3ff;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.9rem;
        }

        #console {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100vw;
            height: 140px;
            background-color: rgba(5, 5, 5, 0.9);
            color: #00ffaa;
            font-family: monospace;
            font-size: 0.75rem;
            border-top: 2px solid #1f2833;
            padding: 8px;
            box-sizing: border-box;
            display: none;
            overflow-y: scroll;
            z-index: 250;
        }
    </style>
</head>
<body>

    <!-- Floating Gear Button for Settings Menu -->
    <button id="settings-gear-btn" onclick="toggleSettingsModal()" title="Settings ⚙️">⚙️</button>

    <!-- Glassmorphism Settings Modal -->
    <div id="settings-modal" onclick="if(event.target===this) toggleSettingsModal()">
        <div class="settings-card">
            <div class="settings-header">
                <span>GAME SETTINGS</span>
                <button class="settings-close-btn" onclick="toggleSettingsModal()">✕</button>
            </div>

            <div class="settings-row">
                <label>Touch Controls:</label>
                <button id="modal-touch-btn" onclick="toggleTouchControls()">AUTO</button>
            </div>

            <div class="settings-row">
                <label>Control Layout:</label>
                <button id="modal-edit-btn" onclick="toggleEditLayoutMode()">Edit Layout ✏️</button>
            </div>

            <div class="settings-row">
                <label>Reset Layout:</label>
                <button onclick="resetControlLayoutToDefault()">Reset Defaults 🔄</button>
            </div>

            <div class="settings-row">
                <label>Resolution:</label>
                <select id="res" onchange="CheatCodeManager.winsize = this.value; CheatCodeManager.resize()">
                    <option value="640 480">640x480</option>
                    <option value="800 600">800x600</option>
                    <option value="1024 768">1024x768</option>
                    <option value="1280 960">1280x960</option>
                </select>
            </div>

            <div class="settings-row">
                <label>Game Scale:</label>
                <select id="scale" onchange="CheatCodeManager.scale = this.value; CheatCodeManager.resize()">
                    <option value="-1">Original</option>
                    <option value="1">1x</option>
                    <option value="1.5">1.5x</option>
                    <option value="2">2x</option>
                </select>
            </div>

            <div class="settings-row">
                <label>Display Mode:</label>
                <button onclick="toggleFullscreenMode()">Fullscreen ⛶</button>
            </div>

            <div class="settings-row">
                <label>Debug Console:</label>
                <button onclick="toggleDebugConsole()">Toggle Log</button>
            </div>
        </div>
    </div>

    <!-- Centered Game Viewport -->
    <div id="game-viewport">
        <div id="loading-screen">
            <div class="claw-logo">CAPTAIN CLAW</div>
            <div id="status-text">Initializing asset assembly...</div>
            <div class="progress-bar-container">
                <div id="progress-bar"></div>
            </div>
            <div id="progress-details">Connecting...</div>
        </div>

        <canvas id="canvas" width="640" height="480" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
    </div>

    <!-- Fullscreen Touch Overlay (Covers Entire Viewport including Black Side Margins) -->
    <div id="touch-controls" class="touch-overlay">
        
        <button id="btn-esc" class="touch-btn touch-btn-util movable-element" data-element-id="btn-esc" title="Pause / Menu">⏸️ PAUSE</button>
        <button id="btn-enter" class="touch-btn touch-btn-util movable-element" data-element-id="btn-enter" title="Select / Confirm">⏎ ENTER</button>

        <!-- Dynamic Floating 8-Direction Virtual Joystick -->
        <div id="joystick-container" class="movable-element" data-element-id="joystick">
            <div class="joy-sector joy-n">▲</div>
            <div class="joy-sector joy-s">▼</div>
            <div class="joy-sector joy-w">◀</div>
            <div class="joy-sector joy-e">▶</div>
            <div id="joystick-knob"></div>
        </div>

        <!-- Action Buttons -->
        <button id="btn-shoot" class="touch-btn action-btn movable-element" data-element-id="btn-shoot" title="Pistol / Shoot">🔫<span class="btn-label">SHOOT</span></button>
        <button id="btn-magic" class="touch-btn action-btn movable-element" data-element-id="btn-magic" title="Magic / Dynamite">💣<span class="btn-label">BOMB</span></button>
        <button id="btn-sword" class="touch-btn action-btn movable-element" data-element-id="btn-sword" title="Sword / Melee">⚔️<span class="btn-label">ATTACK</span></button>
        <button id="btn-jump" class="touch-btn action-btn movable-element" data-element-id="btn-jump" title="Jump">🦘<span class="btn-label">JUMP</span></button>

    </div>

    <!-- Floating Inline Size Tooltip for Selected Button in Edit Mode -->
    <div id="inline-size-tooltip">
        <span id="tooltip-elem-title">Size</span>
        <button class="inline-size-btn" onclick="adjustSelectedElementScale(-0.1)">-</button>
        <span id="tooltip-elem-pct">100%</span>
        <button class="inline-size-btn" onclick="adjustSelectedElementScale(0.1)">+</button>
    </div>

    <textarea id="console" readonly></textarea>

    <script type="text/javascript">
        // Prevent all default touch scrolling
        document.addEventListener('touchmove', function (e) {
            if (e.target.closest('#console') || e.target.closest('#settings-modal')) return;
            e.preventDefault();
        }, { passive: false });

        // ---------------------------------------------------------------------
        // 1. Keyboard Simulation Helper
        // ---------------------------------------------------------------------
        var activeJoystickKeys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false };

        function simulateKey(code, key, isDown) {
            var eventType = isDown ? 'keydown' : 'keyup';
            var keyCodeMap = {
                'ArrowLeft': 37, 'ArrowUp': 38, 'ArrowRight': 39, 'ArrowDown': 40,
                'Space': 32, 'ControlLeft': 17, 'AltLeft': 18, 'KeyZ': 90,
                'Escape': 27, 'Enter': 13
            };
            var keyCode = keyCodeMap[code] || 0;

            var event = new KeyboardEvent(eventType, {
                key: key, code: code, keyCode: keyCode, which: keyCode,
                bubbles: true, cancelable: true, view: window
            });

            var target = document.getElementById('canvas') || window;
            target.dispatchEvent(event);
            window.dispatchEvent(event);
        }

        // ---------------------------------------------------------------------
        // 2. Dynamic Floating 8-Direction Joystick with 20% Crouch Threshold
        // ---------------------------------------------------------------------
        var joystickContainer = document.getElementById('joystick-container');
        var joystickKnob = document.getElementById('joystick-knob');
        var isJoystickActive = false;
        var joystickTouchId = null;

        function updateJoystickDirection(angleDeg, distance, maxRadius) {
            var newKeys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false };

            var normalMinDistance = 10;
            var crouchMinDistance = maxRadius * 0.20; // Require 20% radius threshold for Crouch!

            if (distance >= normalMinDistance) {
                if (angleDeg >= -22.5 && angleDeg < 22.5) {
                    newKeys.ArrowRight = true;
                } else if (angleDeg >= 22.5 && angleDeg < 67.5) {
                    if (distance >= crouchMinDistance) newKeys.ArrowDown = true;
                    newKeys.ArrowRight = true;
                } else if (angleDeg >= 67.5 && angleDeg < 112.5) {
                    if (distance >= crouchMinDistance) newKeys.ArrowDown = true;
                } else if (angleDeg >= 112.5 && angleDeg < 157.5) {
                    if (distance >= crouchMinDistance) newKeys.ArrowDown = true;
                    newKeys.ArrowLeft = true;
                } else if (angleDeg >= 157.5 || angleDeg < -157.5) {
                    newKeys.ArrowLeft = true;
                } else if (angleDeg >= -157.5 && angleDeg < -112.5) {
                    newKeys.ArrowUp = true; newKeys.ArrowLeft = true;
                } else if (angleDeg >= -112.5 && angleDeg < -67.5) {
                    newKeys.ArrowUp = true;
                } else if (angleDeg >= -67.5 && angleDeg < -22.5) {
                    newKeys.ArrowUp = true; newKeys.ArrowRight = true;
                }
            }

            for (var keyName in newKeys) {
                if (newKeys[keyName] !== activeJoystickKeys[keyName]) {
                    activeJoystickKeys[keyName] = newKeys[keyName];
                    simulateKey(keyName, keyName, newKeys[keyName]);
                }
            }
        }

        function resetJoystick() {
            isJoystickActive = false;
            joystickTouchId = null;
            joystickKnob.style.transform = `translate(0px, 0px)`;
            joystickContainer.classList.remove('active-drag');
            for (var keyName in activeJoystickKeys) {
                if (activeJoystickKeys[keyName]) {
                    activeJoystickKeys[keyName] = false;
                    simulateKey(keyName, keyName, false);
                }
            }
        }

        function handleJoystickMove(clientX, clientY) {
            if (isEditLayoutMode) return;
            var rect = joystickContainer.getBoundingClientRect();
            var centerX = rect.left + rect.width / 2;
            var centerY = rect.top + rect.height / 2;

            var deltaX = clientX - centerX;
            var deltaY = clientY - centerY;
            var distance = Math.hypot(deltaX, deltaY);
            var maxRadius = rect.width / 2 - 25;

            var clampedDistance = Math.min(distance, maxRadius);
            var angleRad = Math.atan2(deltaY, deltaX);
            var angleDeg = angleRad * (180 / Math.PI);

            var knobX = clampedDistance * Math.cos(angleRad);
            var knobY = clampedDistance * Math.sin(angleRad);

            joystickKnob.style.transform = `translate(${knobX}px, ${knobY}px)`;
            updateJoystickDirection(angleDeg, distance, maxRadius);
        }

        // Touch-Anywhere Floating Joystick Placement on Left Screen Half
        var touchControlsOverlay = document.getElementById('touch-controls');

        touchControlsOverlay.addEventListener('touchstart', function (e) {
            if (isEditLayoutMode || isJoystickActive) return;
            var touch = e.changedTouches[0];
            
            // Check if touch target is another interactive button or settings gear
            if (touch.target.closest('.touch-btn') && !touch.target.closest('#joystick-container')) return;
            if (touch.target.closest('#settings-gear-btn') || touch.target.closest('#settings-modal')) return;

            // Touch anywhere on left half of screen (clientX < window.innerWidth * 0.55)
            if (touch.clientX < window.innerWidth * 0.55) {
                e.preventDefault();
                var joyWidth = joystickContainer.offsetWidth || 130;
                var joyHeight = joystickContainer.offsetHeight || 130;

                var newLeft = Math.max(10, Math.min(window.innerWidth * 0.55 - joyWidth, touch.clientX - joyWidth / 2));
                var newTop = Math.max(10, Math.min(window.innerHeight - joyHeight - 10, touch.clientY - joyHeight / 2));

                joystickContainer.style.left = newLeft + 'px';
                joystickContainer.style.top = newTop + 'px';
                joystickContainer.style.right = 'auto';
                joystickContainer.style.bottom = 'auto';
                joystickContainer.classList.add('active-drag');

                joystickTouchId = touch.identifier;
                isJoystickActive = true;
                handleJoystickMove(touch.clientX, touch.clientY);
            }
        }, { passive: false });

        joystickContainer.addEventListener('touchstart', function (e) {
            if (isEditLayoutMode || isJoystickActive) return;
            e.preventDefault();
            var touch = e.changedTouches[0];
            joystickTouchId = touch.identifier;
            isJoystickActive = true;
            joystickContainer.classList.add('active-drag');
            handleJoystickMove(touch.clientX, touch.clientY);
        }, { passive: false });

        window.addEventListener('touchmove', function (e) {
            if (!isJoystickActive) return;
            for (var i = 0; i < e.changedTouches.length; i++) {
                if (e.changedTouches[i].identifier === joystickTouchId) {
                    e.preventDefault();
                    handleJoystickMove(e.changedTouches[i].clientX, e.changedTouches[i].clientY);
                    break;
                }
            }
        }, { passive: false });

        window.addEventListener('touchend', function (e) {
            if (!isJoystickActive) return;
            for (var i = 0; i < e.changedTouches.length; i++) {
                if (e.changedTouches[i].identifier === joystickTouchId) {
                    resetJoystick();
                    break;
                }
            }
        });

        window.addEventListener('touchcancel', resetJoystick);

        joystickContainer.addEventListener('mousedown', function (e) {
            if (isEditLayoutMode) return;
            isJoystickActive = true;
            joystickContainer.classList.add('active-drag');
            handleJoystickMove(e.clientX, e.clientY);
        });

        window.addEventListener('mousemove', function (e) {
            if (isJoystickActive && joystickTouchId === null) {
                handleJoystickMove(e.clientX, e.clientY);
            }
        });

        window.addEventListener('mouseup', function () {
            if (isJoystickActive && joystickTouchId === null) resetJoystick();
        });

        // ---------------------------------------------------------------------
        // 3. Action Buttons Event Binding
        // ---------------------------------------------------------------------
        var touchButtonStates = {};

        function bindActionButton(id, code, key) {
            var btn = document.getElementById(id);
            if (!btn) return;

            function press(e) {
                if (isEditLayoutMode) return;
                if (e) e.preventDefault();
                btn.classList.add('active');
                touchButtonStates[id] = true;
                simulateKey(code, key, true);
            }

            function release(e) {
                if (isEditLayoutMode) return;
                if (e) e.preventDefault();
                btn.classList.remove('active');
                if (touchButtonStates[id]) {
                    touchButtonStates[id] = false;
                    simulateKey(code, key, false);
                }
            }

            btn.addEventListener('touchstart', press, { passive: false });
            btn.addEventListener('touchend', release, { passive: false });
            btn.addEventListener('touchcancel', release, { passive: false });
            btn.addEventListener('mousedown', press);
            btn.addEventListener('mouseup', release);
            btn.addEventListener('mouseleave', release);
        }

        function setupActionButtons() {
            bindActionButton('btn-jump', 'Space', ' ');
            bindActionButton('btn-sword', 'ControlLeft', 'Control');
            bindActionButton('btn-shoot', 'AltLeft', 'Alt');
            bindActionButton('btn-magic', 'KeyZ', 'z');
            bindActionButton('btn-esc', 'Escape', 'Escape');
            bindActionButton('btn-enter', 'Enter', 'Enter');
        }

        // ---------------------------------------------------------------------
        // 4. Custom Drag & Resize Layout System (Full Viewport Movable)
        // ---------------------------------------------------------------------
        var isEditLayoutMode = false;
        var selectedElementForEdit = null;

        var defaultElementPositions = {
            'btn-esc': { left: '15px', top: '15px', scale: 1.0 },
            'btn-enter': { right: '65px', top: '15px', left: 'auto', scale: 1.0 },
            'joystick': { left: '20px', bottom: '20px', top: 'auto', scale: 1.0 },
            'btn-jump': { right: '20px', bottom: '20px', left: 'auto', top: 'auto', scale: 1.0 },
            'btn-sword': { right: '85px', bottom: '20px', left: 'auto', top: 'auto', scale: 1.0 },
            'btn-magic': { right: '20px', bottom: '85px', left: 'auto', top: 'auto', scale: 1.0 },
            'btn-shoot': { right: '85px', bottom: '85px', left: 'auto', top: 'auto', scale: 1.0 }
        };

        var elementLayoutConfig = JSON.parse(JSON.stringify(defaultElementPositions));

        function loadLayoutConfig() {
            try {
                var saved = localStorage.getItem('openclaw_touch_layout_v3');
                if (saved) {
                    var parsed = JSON.parse(saved);
                    Object.assign(elementLayoutConfig, parsed);
                }
            } catch (err) { console.warn("Could not load layout config:", err); }
            applyLayoutConfig();
        }

        function saveLayoutConfig() {
            try {
                localStorage.setItem('openclaw_touch_layout_v3', JSON.stringify(elementLayoutConfig));
            } catch (err) { console.warn("Could not save layout config:", err); }
        }

        function applyLayoutConfig() {
            for (var elemId in elementLayoutConfig) {
                var cfg = elementLayoutConfig[elemId];
                var el = document.querySelector(`[data-element-id="${elemId}"]`);
                if (el) {
                    if (cfg.left !== undefined) el.style.left = cfg.left;
                    if (cfg.top !== undefined) el.style.top = cfg.top;
                    if (cfg.right !== undefined) el.style.right = cfg.right;
                    if (cfg.bottom !== undefined) el.style.bottom = cfg.bottom;
                    var scale = cfg.scale || 1.0;
                    el.style.transform = `scale(${scale})`;
                }
            }
        }

        function resetControlLayoutToDefault() {
            elementLayoutConfig = JSON.parse(JSON.stringify(defaultElementPositions));
            applyLayoutConfig();
            saveLayoutConfig();
            hideInlineSizeTooltip();
            alert("Control layout reset to default positions!");
        }

        function positionInlineSizeTooltip(el) {
            var tooltip = document.getElementById('inline-size-tooltip');
            if (!el || !isEditLayoutMode) {
                tooltip.style.display = 'none';
                return;
            }
            var rect = el.getBoundingClientRect();
            var elemId = el.getAttribute('data-element-id');
            var scale = (elementLayoutConfig[elemId] && elementLayoutConfig[elemId].scale) || 1.0;

            document.getElementById('tooltip-elem-title').innerText = elemId.replace('btn-', '').toUpperCase();
            document.getElementById('tooltip-elem-pct').innerText = Math.round(scale * 100) + '%';

            tooltip.style.left = Math.max(10, Math.min(window.innerWidth - 130, rect.left + rect.width / 2 - 60)) + 'px';
            tooltip.style.top = Math.max(10, rect.top - 42) + 'px';
            tooltip.style.display = 'flex';
        }

        function hideInlineSizeTooltip() {
            document.getElementById('inline-size-tooltip').style.display = 'none';
        }

        function adjustSelectedElementScale(delta) {
            if (!selectedElementForEdit) return;
            var elemId = selectedElementForEdit.getAttribute('data-element-id');
            if (!elementLayoutConfig[elemId]) elementLayoutConfig[elemId] = { scale: 1.0 };
            var curScale = elementLayoutConfig[elemId].scale || 1.0;
            var newScale = Math.min(1.8, Math.max(0.6, Math.round((curScale + delta) * 10) / 10));
            elementLayoutConfig[elemId].scale = newScale;
            applyLayoutConfig();
            saveLayoutConfig();
            positionInlineSizeTooltip(selectedElementForEdit);
        }

        function toggleEditLayoutMode() {
            isEditLayoutMode = !isEditLayoutMode;
            var overlay = document.getElementById('touch-controls');
            var btn = document.getElementById('modal-edit-btn');

            if (isEditLayoutMode) {
                overlay.style.display = 'block';
                btn.innerText = 'Lock Layout 🔒';
                btn.style.backgroundColor = '#00ffaa';
                btn.style.color = '#0b0c10';

                document.querySelectorAll('.movable-element').forEach(el => {
                    el.classList.add('edit-mode-active');
                });
                toggleSettingsModal(false);
            } else {
                btn.innerText = 'Edit Layout ✏️';
                btn.style.backgroundColor = '#0b0c10';
                btn.style.color = '#66fcf1';

                document.querySelectorAll('.movable-element').forEach(el => {
                    el.classList.remove('edit-mode-active');
                });
                hideInlineSizeTooltip();
                selectedElementForEdit = null;

                var isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
                if (touchControlsForcedState === 'auto') {
                    overlay.style.display = isTouch ? 'block' : 'none';
                }
                saveLayoutConfig();
            }
        }

        function setupMovableElements() {
            var activeDragEl = null;
            var dragStartX = 0, dragStartY = 0;
            var initialLeft = 0, initialTop = 0;

            document.querySelectorAll('.movable-element').forEach(el => {
                function onDragStart(e) {
                    if (!isEditLayoutMode) return;
                    e.preventDefault();
                    activeDragEl = el;
                    selectedElementForEdit = el;
                    positionInlineSizeTooltip(el);

                    var clientX = e.touches ? e.touches[0].clientX : e.clientX;
                    var clientY = e.touches ? e.touches[0].clientY : e.clientY;

                    dragStartX = clientX;
                    dragStartY = clientY;

                    var rect = el.getBoundingClientRect();
                    initialLeft = rect.left;
                    initialTop = rect.top;
                }

                el.addEventListener('touchstart', onDragStart, { passive: false });
                el.addEventListener('mousedown', onDragStart);
            });

            function onDragMove(e) {
                if (!activeDragEl || !isEditLayoutMode) return;
                e.preventDefault();
                var clientX = e.touches ? e.touches[0].clientX : e.clientX;
                var clientY = e.touches ? e.touches[0].clientY : e.clientY;

                var deltaX = clientX - dragStartX;
                var deltaY = clientY - dragStartY;

                var newLeft = Math.max(0, Math.min(window.innerWidth - 30, initialLeft + deltaX));
                var newTop = Math.max(0, Math.min(window.innerHeight - 30, initialTop + deltaY));

                activeDragEl.style.left = newLeft + 'px';
                activeDragEl.style.top = newTop + 'px';
                activeDragEl.style.right = 'auto';
                activeDragEl.style.bottom = 'auto';

                var elemId = activeDragEl.getAttribute('data-element-id');
                if (!elementLayoutConfig[elemId]) elementLayoutConfig[elemId] = {};
                elementLayoutConfig[elemId].left = newLeft + 'px';
                elementLayoutConfig[elemId].top = newTop + 'px';
                elementLayoutConfig[elemId].right = 'auto';
                elementLayoutConfig[elemId].bottom = 'auto';

                positionInlineSizeTooltip(activeDragEl);
            }

            function onDragEnd() {
                if (activeDragEl && isEditLayoutMode) {
                    saveLayoutConfig();
                    activeDragEl = null;
                }
            }

            window.addEventListener('touchmove', onDragMove, { passive: false });
            window.addEventListener('mousemove', onDragMove);
            window.addEventListener('touchend', onDragEnd);
            window.addEventListener('mouseup', onDragEnd);
        }

        // ---------------------------------------------------------------------
        // 5. Settings Modal, Mobile Auto-Resolution & Fullscreen Behavior
        // ---------------------------------------------------------------------
        var touchControlsForcedState = 'auto';

        function toggleSettingsModal(show) {
            var modal = document.getElementById('settings-modal');
            if (show === undefined) show = (modal.style.display !== 'flex');
            modal.style.display = show ? 'flex' : 'none';
        }

        function toggleTouchControls() {
            var overlay = document.getElementById('touch-controls');
            var btn = document.getElementById('modal-touch-btn');
            if (touchControlsForcedState === 'auto') {
                touchControlsForcedState = 'on';
                overlay.style.display = 'block';
                btn.innerText = 'ON';
            } else if (touchControlsForcedState === 'on') {
                touchControlsForcedState = 'off';
                overlay.style.display = 'none';
                btn.innerText = 'OFF';
            } else {
                touchControlsForcedState = 'auto';
                var isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
                overlay.style.display = isTouch ? 'block' : 'none';
                btn.innerText = 'AUTO';
            }
        }

        function toggleFullscreenMode() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => console.warn(err));
            } else {
                document.exitFullscreen().catch(err => console.warn(err));
            }
            toggleSettingsModal(false);
        }

        function setupMobileResolutionAndFullscreen() {
            var isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || ('ontouchstart' in window);
            
            if (isMobile && !window.localStorage.getItem('width')) {
                window.localStorage.setItem('width', '1024');
                window.localStorage.setItem('height', '768');
                window.localStorage.setItem('scale', '-1');
                document.getElementById('res').value = '1024 768';
            }

            document.addEventListener('fullscreenchange', function () {
                var overlay = document.getElementById('touch-controls');
                if (document.fullscreenElement) {
                    if (touchControlsForcedState !== 'on') {
                        overlay.style.display = 'none';
                    }
                } else {
                    if (touchControlsForcedState === 'auto') {
                        var isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
                        overlay.style.display = isTouchDevice ? 'block' : 'none';
                    } else if (touchControlsForcedState === 'on') {
                        overlay.style.display = 'block';
                    }
                }
            });

            if (isMobile && touchControlsForcedState === 'auto') {
                document.getElementById('touch-controls').style.display = 'block';
            }
        }

        window.addEventListener('DOMContentLoaded', function () {
            setupActionButtons();
            setupMovableElements();
            loadLayoutConfig();
            setupMobileResolutionAndFullscreen();
        });
    </script>

    <script type="text/javascript">
        // Cheat Code & Console Helpers
        var CheatCodeManager = {
            winsize: "640 480",
            scale: -1,
            pushEvent: function (key, event, target) {
                return target.dispatchEvent(new KeyboardEvent(event, {
                    'keyCode': key, 'charCode': key, 'view': window, 'bubbles': true, 'cancelable': true
                }));
            },
            click: function (key, target) {
                if (CheatCodeManager.pushEvent(key, 'keydown', target)) {
                    CheatCodeManager.pushEvent(key, 'keypress', target);
                }
                CheatCodeManager.pushEvent(key, 'keyup', target);
            },
            openOrCloseConsole: function (target) {
                CheatCodeManager.click(192, target);
                CheatCodeManager.click(8, target);
                CheatCodeManager.click(8, target);
            },
            write: function (cheat, target) {
                CheatCodeManager.openOrCloseConsole(target);
                for (var i = 0; i < cheat.length; i++) {
                    CheatCodeManager.click(cheat.charCodeAt(i), target);
                }
                CheatCodeManager.click(13, target);
                CheatCodeManager.openOrCloseConsole(target);
            },
            resize: function () {
                CheatCodeManager.write("WINRESIZE " + CheatCodeManager.winsize + " " + CheatCodeManager.scale, Module.canvas);
                var width = parseInt(CheatCodeManager.winsize.split(" ")[0]);
                var height = parseInt(CheatCodeManager.winsize.split(" ")[1]);
                var scale = parseFloat(CheatCodeManager.scale);
                window.localStorage.setItem("width", width);
                window.localStorage.setItem("height", height);
                window.localStorage.setItem("scale", scale);
            }
        };

        function toggleDebugConsole() {
            var c = document.getElementById('console');
            c.style.display = (c.style.display === 'none' || !c.style.display) ? 'block' : 'none';
        }

        var Console = {
            elem: document.getElementById('console'),
            printToConsole: function (text) {
                if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
                console.log(text);
                if (Console.elem) {
                    Console.elem.value += text + "\n";
                    Console.elem.scrollTop = Console.elem.scrollHeight;
                }
            }
        };

        // IndexedDB Cache Helper for openclaw.data
        var DB_NAME = 'OpenClawAssetsDB';
        var DB_VERSION = 1;
        var STORE_NAME = 'assets';

        function openDB() {
            return new Promise(function (resolve, reject) {
                var request = indexedDB.open(DB_NAME, DB_VERSION);
                request.onupgradeneeded = function (e) {
                    var db = e.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        db.createObjectStore(STORE_NAME);
                    }
                };
                request.onsuccess = function (e) { resolve(e.target.result); };
                request.onerror = function (e) { reject(e); };
            });
        }

        function getCachedAsset(key) {
            return openDB().then(function (db) {
                return new Promise(function (resolve, reject) {
                    var tx = db.transaction(STORE_NAME, 'readonly');
                    var store = tx.objectStore(STORE_NAME);
                    var request = store.get(key);
                    request.onsuccess = function () { resolve(request.result); };
                    request.onerror = function (e) { reject(e); };
                });
            }).catch(function () { return null; });
        }

        function setCachedAsset(key, data) {
            return openDB().then(function (db) {
                return new Promise(function (resolve, reject) {
                    var tx = db.transaction(STORE_NAME, 'readwrite');
                    var store = tx.objectStore(STORE_NAME);
                    var request = store.put(data, key);
                    request.onsuccess = function () { resolve(); };
                    request.onerror = function (e) { reject(e); };
                });
            }).catch(function (err) { console.warn("Failed to cache in IndexedDB:", err); });
        }
    </script>

    <script type="text/javascript">
        var loadingScreen = document.getElementById("loading-screen");
        var statusText = document.getElementById("status-text");
        var progressBar = document.getElementById("progress-bar");
        var progressDetails = document.getElementById("progress-details");
        var canvas = document.getElementById("canvas");

        var compiledDataBuffer = null;
        var compiledWasmBuffer = null;

        var Module = {
            preRun: [function () {
                if (loadingScreen) loadingScreen.style.display = "none";
                canvas.style.display = "block";
            }],
            canvas: (function () {
                canvas.addEventListener("webglcontextlost", function (e) {
                    alert('WebGL context lost. Please reload the page.');
                    e.preventDefault();
                }, false);
                return canvas;
            })(),
            setStatus: function (text) {
                if (text && statusText) {
                    statusText.innerText = text;
                }
            },
            print: Console.printToConsole,
            printErr: Console.printToConsole
        };

        function updateProgress(text, loadedBytes, totalBytes) {
            statusText.innerText = text;
            if (totalBytes > 0) {
                var pct = Math.min(100, Math.round((loadedBytes / totalBytes) * 100));
                progressBar.style.width = pct + "%";
                var loadedMB = (loadedBytes / (1024 * 1024)).toFixed(1);
                var totalMB = (totalBytes / (1024 * 1024)).toFixed(1);
                progressDetails.innerText = loadedMB + " MB / " + totalMB + " MB (" + pct + "%)";
            }
        }

        async function fetchPartWithProgress(partUrl, onProgress) {
            var response = await fetch(partUrl);
            if (!response.ok) throw new Error("Failed to fetch " + partUrl + ": " + response.statusText);
            
            var contentLength = response.headers.get("content-length");
            var total = contentLength ? parseInt(contentLength, 10) : 0;
            var reader = response.body.getReader();
            var chunks = [];
            var received = 0;

            while (true) {
                var res = await reader.read();
                if (res.done) break;
                chunks.push(res.value);
                received += res.value.length;
                if (onProgress) onProgress(res.value.length, total);
            }

            var concatenated = new Uint8Array(received);
            var offset = 0;
            for (var chunk of chunks) {
                concatenated.set(chunk, offset);
                offset += chunk.length;
            }
            return concatenated;
        }

        async function fetchAndAssembleParts(partsList, expectedTotalSize, label, overallOffset, totalOverallBytes, onOverallProgress) {
            var combined = new Uint8Array(expectedTotalSize);
            var currentWriteOffset = 0;

            for (var i = 0; i < partsList.length; i++) {
                var partName = partsList[i];
                var partData = await fetchPartWithProgress(partName, function (bytesRead) {
                    if (onOverallProgress) onOverallProgress(bytesRead);
                });
                combined.set(partData, currentWriteOffset);
                currentWriteOffset += partData.length;
            }
            return combined;
        }

        async function startAssetLoadingAndLaunch() {
            try {
                updateProgress("Loading manifest...", 0, 100);
                var manifestRes = await fetch("manifest.json");
                if (!manifestRes.ok) throw new Error("Failed to load manifest.json");
                var manifest = await manifestRes.json();

                var totalDownloadBytes = manifest.wasmSize + manifest.dataSize;
                var totalDownloadedSoFar = 0;

                // 1. Check IndexedDB for cached openclaw.data
                updateProgress("Checking browser cache...", 0, totalDownloadBytes);
                var cachedData = await getCachedAsset("openclaw.data_v1");

                if (cachedData && cachedData.byteLength === manifest.dataSize) {
                    console.log("Found valid cached openclaw.data in IndexedDB (" + cachedData.byteLength + " bytes)");
                    compiledDataBuffer = new Uint8Array(cachedData);
                    totalDownloadedSoFar += manifest.dataSize;
                } else {
                    console.log("Downloading openclaw.data chunks...");
                    compiledDataBuffer = await fetchAndAssembleParts(
                        manifest.dataParts,
                        manifest.dataSize,
                        "Game Assets (data)",
                        totalDownloadedSoFar,
                        totalDownloadBytes,
                        function (bytesRead) {
                            totalDownloadedSoFar += bytesRead;
                            updateProgress("Downloading game assets...", totalDownloadedSoFar, totalDownloadBytes);
                        }
                    );
                    setCachedAsset("openclaw.data_v1", compiledDataBuffer.buffer);
                }

                // 2. Download WASM parts
                updateProgress("Downloading WebAssembly engine...", totalDownloadedSoFar, totalDownloadBytes);
                compiledWasmBuffer = await fetchAndAssembleParts(
                    manifest.wasmParts,
                    manifest.wasmSize,
                    "Engine (WASM)",
                    totalDownloadedSoFar,
                    totalDownloadBytes,
                    function (bytesRead) {
                        totalDownloadedSoFar += bytesRead;
                        updateProgress("Downloading WebAssembly engine...", totalDownloadedSoFar, totalDownloadBytes);
                    }
                );

                updateProgress("Initializing WebAssembly runtime...", totalDownloadBytes, totalDownloadBytes);

                // 3. Inject compiled buffers into Emscripten Module
                Module['wasmBinary'] = compiledWasmBuffer.buffer;
                Module['getPreloadedPackage'] = function (packageName, packageSize) {
                    return compiledDataBuffer.buffer;
                };

                // 4. Load openclaw.js
                var script = document.createElement("script");
                script.async = true;
                script.type = "text/javascript";
                script.src = "openclaw.js";
                script.onerror = function (err) {
                    console.error("Failed to load openclaw.js", err);
                    updateProgress("Failed to launch openclaw.js script", 0, 0);
                };
                document.body.appendChild(script);

            } catch (err) {
                console.error("Asset loading error:", err);
                updateProgress("Error: " + err.message, 0, 0);
            }
        }

        if (window.localStorage.width && window.localStorage.height && window.localStorage.scale) {
            document.getElementById('res').value = window.localStorage.width + " " + window.localStorage.height;
            document.getElementById('scale').value = window.localStorage.scale;
            CheatCodeManager.winsize = window.localStorage.width + " " + window.localStorage.height;
            CheatCodeManager.scale = window.localStorage.scale;
        }

        // Start loading pipeline
        startAssetLoadingAndLaunch();
    </script>
